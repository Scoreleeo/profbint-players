name: Update Player Database

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * 3"

permissions:
  contents: write

jobs:
  update-player-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Player Database
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: "2026"
        run: npm run build:index

      - name: Commit updated Player Database
        run: |
          if git diff --quiet -- public/data/players.json public/data/player-search.json; then
            echo "Player Database has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/players.json public/data/player-search.json
          git commit -m "Update Player Database"
          git push
