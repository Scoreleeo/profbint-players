name: Update Team of the Week

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * 2"

permissions:
  contents: write

jobs:
  update-team-of-the-week:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Team of the Week
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run build:totw

      - name: Commit updated Team of the Week
        run: |
          if git diff --quiet -- public/data/team-of-the-week.json; then
            echo "Team of the Week has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/team-of-the-week.json
          git commit -m "Update Team of the Week"
          git push